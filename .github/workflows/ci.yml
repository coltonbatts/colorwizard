name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Lint
        run: npm run lint
        
      - name: Typecheck
        run: npm run typecheck
        
      - name: Validate paints
        run: npm run validate:paints
        
      - name: Check unreachable files
        run: npm run unreachable:check
        
      - name: Test
        run: npm test -- --run
        
      - name: Build
        run: npm run build
